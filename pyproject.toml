
[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finpulse"
version = "0.1.0"
description = "Personal Finance Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11,<3.14"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]

ingestion = [
    "pandas>=2.2",
    "pdfplumber>=0.11",
    "python-multipart>=0.0.9",
]

messaging = [
    "confluent-kafka>=2.6",
]

lake = [
    "deltalake>=0.22",
    "pyarrow>=18",
]

warehouse = [
    "google-cloud-bigquery>=3.26",
    "dbt-bigquery>=1.8",
]

analytics = [
    "streamlit>=1.40",
    "plotly>=5.24",
]

ml = [
    "scikit-learn>=1.5",
    "xgboost>=2.1",
]

dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
